<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Управление товарами — Sotovik Zaisan</title>
<link rel="icon" href="assets/logo/favicon.png"><link rel="stylesheet" href="css/style.css">
<style>
.admin-wrap{max-width:1100px;margin:0 auto;padding:28px 18px 70px}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}.admin-panel{background:var(--card,#fff);border:1px solid var(--line,#ddd);border-radius:18px;padding:20px;margin:16px 0}.admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.admin-field{display:flex;flex-direction:column;gap:6px}.admin-field.full{grid-column:1/-1}.admin-field input,.admin-field textarea,.admin-field select{width:100%;padding:12px;border:1px solid var(--line,#ddd);border-radius:10px;font:inherit;background:var(--bg,#fff);color:inherit}.admin-field textarea{min-height:100px;resize:vertical}.admin-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.admin-list{display:grid;gap:10px}.admin-item{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:12px;padding:10px;border:1px solid var(--line,#ddd);border-radius:12px}.admin-item img{width:76px;height:76px;object-fit:cover;border-radius:9px;background:#eee}.admin-item small{display:block;color:var(--muted,#777);margin-top:4px}.admin-msg{padding:12px;border-radius:10px;background:#eef4ff;margin:12px 0;white-space:pre-wrap}.admin-muted{color:var(--muted,#777)}.admin-checks{display:flex;gap:16px;flex-wrap:wrap}.admin-checks label{display:flex;align-items:center;gap:7px}.admin-hidden{display:none!important}@media(max-width:650px){.admin-grid{grid-template-columns:1fr}.admin-item{grid-template-columns:60px 1fr}.admin-item img{width:60px;height:60px}.admin-item .admin-actions{grid-column:1/-1;margin-top:0}.admin-panel{padding:15px}}
</style>
</head>
<body>
<div class="admin-wrap">
  <div class="admin-top"><a class="logo" href="./"><span class="mark"></span><span>SOTOVIK ZAISAN</span></a><a class="btn" href="./">Открыть сайт</a></div>
  <h1>Управление товарами</h1><p class="admin-muted">Доступ только для добавленных администраторов.</p>
  <section id="loginPanel" class="admin-panel">
    <h2>Вход</h2><p class="admin-muted">Войдите по адресу электронной почты и паролю, созданным владельцем магазина.</p>
    <div class="admin-grid"><label class="admin-field">Электронная почта<input id="email" type="email" autocomplete="username" required></label><label class="admin-field">Пароль<input id="password" type="password" autocomplete="current-password" required></label></div>
    <div class="admin-actions"><button class="btn pri" id="loginBtn">Войти</button></div>
  </section>
  <section id="appPanel" class="admin-hidden">
    <div class="admin-top"><div><b id="who"></b><div class="admin-muted">Каталог магазина</div></div><button class="btn" id="logoutBtn">Выйти</button></div>
    <div id="message" class="admin-msg admin-hidden" role="status"></div>
    <section class="admin-panel"><div class="admin-top"><h2>Товары <span id="count"></span></h2><button class="btn pri" id="addBtn">＋ Добавить товар</button></div><input id="search" class="in" type="search" placeholder="Найти товар по названию…" style="width:100%;margin-bottom:14px"><div id="productList" class="admin-list"></div></section>
    <section id="editPanel" class="admin-panel admin-hidden">
      <h2 id="formTitle">Новый товар</h2>
      <form id="productForm">
        <div class="admin-grid">
          <label class="admin-field">Название *<input id="pName" required maxlength="160"></label>
          <label class="admin-field">Бренд<input id="pBrand" maxlength="80"></label>
          <label class="admin-field">Категория<select id="pCategory"><option value="smartphones">Смартфоны</option><option value="phones_new">Новые смартфоны</option><option value="phones_used">Смартфоны б/у</option><option value="headphones">Наушники</option><option value="chargers">Зарядные устройства</option><option value="cables">Кабели</option><option value="watches">Умные часы</option><option value="other">Разное</option></select></label>
          <label class="admin-field">Цена, ₸ *<input id="pPrice" type="number" min="0" step="1" required></label>
          <label class="admin-field">Старая цена, ₸<input id="pOldPrice" type="number" min="0" step="1"></label>
          <label class="admin-field">Наличие<select id="pAvailability"><option value="in_stock">В наличии</option><option value="order">Под заказ</option><option value="out">Нет в наличии</option></select></label>
          <label class="admin-field full">Описание<textarea id="pDescription"></textarea></label>
          <label class="admin-field">Название на казахском (необязательно)<input id="pNameKk" maxlength="200"></label>
          <label class="admin-field full">Описание на казахском (необязательно)<textarea id="pDescriptionKk"></textarea></label>
          <label class="admin-field full">Фотографии товара<input id="pImages" type="file" accept="image/*" multiple><small class="admin-muted">Можно выбрать несколько фотографий. Они загрузятся в облачное хранилище.</small><div id="imagePreview" class="admin-muted"></div></label>
          <label class="admin-field full">Характеристики (каждая с новой строки: ключ: значение)<textarea id="pSpecs" placeholder="storage: 256 ГБ&#10;color: Чёрный&#10;condition: Б/у"></textarea></label>
        </div>
        <div class="admin-checks" style="margin-top:16px"><label><input id="pFeatured" type="checkbox"> Популярное</label><label><input id="pNew" type="checkbox"> Новинка</label><label><input id="pSale" type="checkbox"> Акция</label></div>
        <div class="admin-actions"><button class="btn pri" type="submit" id="saveBtn">Сохранить</button><button class="btn" type="button" id="cancelBtn">Отмена</button></div>
      </form>
    </section>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/admin.js"></script>
</body></html>
