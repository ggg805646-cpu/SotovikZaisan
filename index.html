<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f7ff">
<title>Sotovik Zaisan — контакты</title>
<style>
:root{--blue:#1726c9;--blue2:#3448ef;--ink:#172033;--muted:#68738a;--line:#e7ebf5;--surface:#fff;--bg:#f4f7ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#e0e7ff 0,transparent 48%),var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);display:flex;justify-content:center}
main{width:min(100%,480px);padding:46px 22px 32px;display:flex;flex-direction:column;align-items:center}
.brand{width:124px;height:124px;border-radius:28px;overflow:hidden;box-shadow:0 12px 32px #1726c926;margin-bottom:22px;background:#1010c5}
.brand img{width:100%;height:100%;object-fit:cover}
h1{font-size:25px;letter-spacing:.12em;margin:0;font-weight:800;text-align:center}
.subtitle{font-size:14px;color:var(--muted);margin:9px 0 32px;text-align:center}
.panel{width:100%;display:flex;flex-direction:column;gap:13px}
button,.link{font:inherit}
.main-button,.link-button{width:100%;min-height:62px;border:1px solid #e4e9f7;border-radius:18px;background:rgba(255,255,255,.88);color:#1c2a46;display:flex;align-items:center;gap:14px;padding:0 19px;text-decoration:none;font-weight:650;font-size:16px;box-shadow:0 5px 18px #263b8010;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s}
.main-button:hover,.link-button:hover{transform:translateY(-2px);border-color:#bdc9ff;box-shadow:0 10px 24px #263b8018}
.main-button:active,.link-button:active{transform:scale(.99)}
.icon{width:35px;height:35px;border-radius:12px;display:grid;place-items:center;background:#eef1ff;color:var(--blue);flex:none}
.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.arrow{margin-left:auto;color:#9aa5bd;font-size:22px;font-weight:400}
.view{width:100%;display:none}
.view.active{display:block;animation:appear .22s ease}
.home.active{display:flex;flex-direction:column;align-items:center}
.back{border:0;background:transparent;color:#52617d;padding:8px 0 20px;cursor:pointer;font-size:14px;font-weight:600}
.back span{font-size:18px;margin-right:7px}
.view h2{font-size:23px;margin:0 0 8px}
.view .description{font-size:14px;color:var(--muted);margin:0 0 23px}
.link-button{margin-bottom:12px;min-height:60px}
.small-label{font-size:12px;color:#8a94aa;text-transform:uppercase;letter-spacing:.09em;font-weight:700;margin:25px 0 10px}
.footer{margin-top:auto;padding-top:38px;color:#a0a8b9;font-size:12px;text-align:center}
@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(min-height:800px){main{padding-top:68px}}
</style>
</head>
